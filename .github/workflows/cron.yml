name: Hourly Sales Scan

on:
  schedule:
    # Run every hour at minute 0 (UTC). GitHub often delays scheduled runs, so two runs can
    # land well under an hour apart — the API answers 429 for those, which is not a failure.
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent hanging jobs
    concurrency:
      group: sales-scan
      cancel-in-progress: true  # Cancel previous runs if new one starts

    # Only curl is needed — no checkout or npm install, the scan runs on Vercel.
    steps:
      - name: Trigger Sales Scan
        env:
          SCAN_URL: ${{ secrets.VERCEL_URL }}/api/scan
        run: |
          echo "Starting sales scan at $(date -u)"

          for i in 1 2 3; do
            echo "Attempt $i of 3"

            # No curl --retry: it re-POSTs on 429/5xx itself, triggering duplicate scans.
            http_code=$(curl -s -o response.json -w "%{http_code}" -X POST "$SCAN_URL" \
              -H "Content-Type: application/json" \
              --max-time 300) || true

            echo "HTTP Status: $http_code"
            echo "Response: $(cat response.json 2>/dev/null)"

            case "$http_code" in
              200)
                echo "Scan completed successfully at $(date -u)"
                exit 0
                ;;
              429)
                # A scan already succeeded within the last 45 minutes (delayed cron run).
                echo "::notice::Skipped — last scan was too recent"
                exit 0
                ;;
              409)
                echo "::notice::Skipped — a scan is already in progress"
                exit 0
                ;;
            esac

            if [ "$i" -lt 3 ]; then
              echo "Scan failed with status $http_code, retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "::error::All retry attempts failed (last status $http_code)"
          exit 1
